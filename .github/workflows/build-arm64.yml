name: Build & Sign Apple Silicon (darwin_arm64) Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package name to build (or 'all' for all missing darwin_arm64 packages)"
        required: false
        default: "all"
        type: string
      max_packages:
        description: "Max packages to build in one run (0 = build all)"
        required: false
        default: "0"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-arm64.yml"
      - "packages/core/**/PKGBUILD"
      - "packages/extra/**/PKGBUILD"
      - "core/*-darwin_x86_64.pkg.tar.zst"
      - "extra/*-darwin_x86_64.pkg.tar.zst"
      - "scripts/ci_build_arm64.py"
  schedule:
    # Weekly catch-up run every Sunday at 03:00 UTC ($0 free on public repos)
    - cron: "0 3 * * 0"

permissions:
  contents: write

concurrency:
  group: build-darwin-arm64
  cancel-in-progress: false

jobs:
  build-arm64:
    name: Native Apple Silicon (darwin_arm64) Builder
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Apple Silicon arm64 host & install bootstrap build tools
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 \
            brew install bash meson ninja pkgconf libarchive openssl@3 gpgme gnupg zstd autoconf automake libtool gettext coreutils gnu-sed gawk grep

      - name: Import PGP Signing Key (CEC5B78775CA4628)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Missing GPG_PRIVATE_KEY repository secret!"
            exit 1
          fi
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          cat > "$HOME/.gnupg/gpg.conf" <<'EOF'
          pinentry-mode loopback
          no-tty
          batch
          yes
          EOF
          cat > "$HOME/.gnupg/gpg-agent.conf" <<'EOF'
          allow-loopback-pinentry
          default-cache-ttl 86400
          max-cache-ttl 86400
          EOF
          gpgconf --kill gpg-agent || true
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          FPR="$(gpg --list-secret-keys --with-colons CEC5B78775CA4628 | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "${FPR}:6:" | gpg --import-ownertrust
          gpg --list-secret-keys CEC5B78775CA4628

      - name: Bootstrap Rootless /opt/pacman & Populate Existing darwin_arm64 Sysroot
        run: |
          sudo mkdir -p /opt/pacman/bin
          sudo chown -R "$USER:$(id -gn)" /opt/pacman
          export PATH="/opt/pacman/bin:/opt/homebrew/bin:$PATH"

          # Stage working arm64 Bash 5.x at /opt/pacman/bin/bash so meson binds #!/opt/pacman/bin/bash
          # before core/readline is built in Tier 1
          cp -f /opt/homebrew/bin/bash /opt/pacman/bin/bash
          chmod 755 /opt/pacman/bin/bash

          # 1. Build native darwin_arm64 pacman, makepkg & repo-add
          SKIP_INITIAL_SYNC=1 NONINTERACTIVE=1 PATH_PRIORITY=skip bash ./install.sh -y

          # 2. Initialize ALPM keyring and trust CEC5B78775CA4628
          export PATH="/opt/pacman/bin:/opt/homebrew/bin:$PATH"
          gpg --armor --export CEC5B78775CA4628 > /tmp/packager.asc
          /opt/pacman/bin/pacman-key --init
          /opt/pacman/bin/pacman-key --add /tmp/packager.asc
          /opt/pacman/bin/pacman-key --lsign-key CEC5B78775CA4628
          rm -f /tmp/packager.asc

          # 3. Seed /opt/pacman ONLY with existing darwin_arm64 packages targeting macOS <= 15.0
          #    (Packages built on macOS 26/27 have _pipe2 ABI incompatibility on macos-15 and are rebuilt in Tier 0)
          python3 - <<'PYEOF'
          import re, subprocess, tempfile
          from pathlib import Path

          SKIP = {"base", "base-devel", "libarchive", "gpgme", "pacman"}

          def is_macos15_compatible(pkg: Path) -> bool:
              raw = pkg.name[:-len("-darwin_arm64.pkg.tar.zst")]
              name = "-".join(raw.split("-")[:-2])
              if name in SKIP:
                  return False
              with tempfile.TemporaryDirectory() as td:
                  subprocess.run(["/opt/homebrew/opt/libarchive/bin/bsdtar", "-xf", str(pkg), "-C", td], check=False, capture_output=True)
                  for sub in ("opt/pacman/bin", "opt/pacman/lib"):
                      d = Path(td) / sub
                      if not d.exists():
                          continue
                      for f in sorted(d.iterdir())[:8]:
                          if f.is_symlink() or not f.is_file():
                              continue
                          out = subprocess.run(["/usr/bin/otool", "-l", str(f)], capture_output=True, text=True)
                          for m in re.finditer(r"minos\s+([0-9.]+)", out.stdout):
                              if float(m.group(1).split(".")[0]) > 15.0:
                                  return False
              return True

          for repo in ("core", "extra"):
              pkgs = [str(p) for p in sorted(Path(repo).glob("*-darwin_arm64.pkg.tar.zst")) if is_macos15_compatible(p)]
              print(f"Seeding {len(pkgs)} macos-15-compatible {repo} packages...")
              if pkgs:
                  subprocess.run(["/opt/pacman/bin/pacman", "-U", "-dd", "--overwrite", "*", "--noconfirm"] + pkgs, check=True)
          PYEOF

          # 4. Re-install patched pacman/makepkg/repo-add so all Darwin rootless fixes are active
          cp -f /opt/pacman/etc/pacman.conf /tmp/pacman.conf.saved
          ninja -C pacman/build install
          cp -f /tmp/pacman.conf.saved /opt/pacman/etc/pacman.conf
          rm -f /tmp/pacman.conf.saved

          # Keep working arm64 bash & bsdtar & gpg available until Tier 1 builds bzip2, xz, readline & pinentry
          cp -f /opt/homebrew/bin/bash /opt/pacman/bin/bash
          chmod 755 /opt/pacman/bin/bash
          if [ ! -x /opt/pacman/bin/bsdtar ]; then
            ln -sf /opt/homebrew/opt/libarchive/bin/bsdtar /opt/pacman/bin/bsdtar
          fi
          if [ ! -x /opt/pacman/bin/gpg ] || ! /opt/pacman/bin/gpg --version >/dev/null 2>&1; then
            ln -sf /opt/homebrew/bin/gpg /opt/pacman/bin/gpg
          fi

          /usr/bin/sed -i '' 's/^CARCH=.*/CARCH="darwin_arm64"/' /opt/pacman/etc/makepkg.conf
          /usr/bin/sed -i '' 's/^CHOST=.*/CHOST="arm64-apple-darwin"/' /opt/pacman/etc/makepkg.conf
          /usr/bin/sed -i '' 's/^OPTIONS=(strip /OPTIONS=(!strip /' /opt/pacman/etc/makepkg.conf
          /usr/bin/sed -i '' 's/^PKGEXT=.*/PKGEXT=".pkg.tar.zst"/' /opt/pacman/etc/makepkg.conf
          /usr/bin/sed -i '' 's|^#*PACKAGER=.*|PACKAGER="Revanth Reddy Nemtoor <developerrevanth123@gmail.com>"|' /opt/pacman/etc/makepkg.conf

          # Restore any repo files touched by install.sh so git working tree is clean for checkpoint rebases
          git checkout -- configs/ core/ extra/ || true

      - name: Configure Git identity for automated package commits
        run: |
          git config user.name "Revanth Reddy Nemtoor"
          git config user.email "developerrevanth123@gmail.com"

      - name: Build, Sign, Index & Push Missing darwin_arm64 Packages
        env:
          PACKAGER: "Revanth Reddy Nemtoor <developerrevanth123@gmail.com>"
        run: |
          PKG_ARG="${{ inputs.package || 'all' }}"
          MAX_ARG="${{ inputs.max_packages || '0' }}"
          python3 scripts/ci_build_arm64.py \
            --package "$PKG_ARG" \
            --max-packages "$MAX_ARG" \
            --checkpoint-every 10
