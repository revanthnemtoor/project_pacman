#
# /opt/pacman/etc/pacman.conf
# Native macOS Pacman Configuration (darwin_x86_64 Only - Prevents Cross-Arch Crashes)
#

[options]
RootDir     = /
DBPath      = /opt/pacman/var/lib/pacman/
CacheDir    = /opt/pacman/var/cache/pacman/pkg/
LogFile     = /opt/pacman/var/log/pacman.log
GPGDir      = /opt/pacman/etc/pacman.d/gnupg/
HookDir     = /opt/pacman/etc/pacman.d/hooks/
HoldPkg     = pacman
Architecture = darwin_x86_64 x86_64 any

Color
CheckSpace
ParallelDownloads = 5

SigLevel    = Optional TrustAll
LocalFileSigLevel = Optional
RemoteFileSigLevel = Optional
NoExtract   = opt/pacman/share/info/dir

[core]
SigLevel = Optional TrustAll
Server = file:///Users/revanth/Projects/Pacman_Arch_Porting/core
# Remote arm64 mirror disabled on darwin_x86_64 to prevent cross-arch crashes

[pacman]
SigLevel = Optional TrustAll
Server = file:///Users/revanth/Projects/Pacman_Arch_Porting/output
